services:
  nats:
    # Revalidate this exact upstream pin before publishing new benchmark results.
    image: ${NATS_IMAGE:-nats:2.14.5-alpine3.22}
    command: ["--config", "/etc/nats/nats-server.conf"]
    configs:
      - source: nats_server
        target: /etc/nats/nats-server.conf
    # Linux host networking removes Docker's port-mapping path from the result.
    network_mode: host
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
    stop_grace_period: 30s

  postgres:
    # Revalidate this exact upstream pin before publishing new benchmark results.
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burstlab}
      POSTGRES_USER: ${POSTGRES_USER:-burstlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burstlab}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    network_mode: host
    volumes:
      # PostgreSQL 18 uses a major-version-specific PGDATA below this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 1m

volumes:
  nats_data:
  postgres_data:

configs:
  nats_server:
    content: |
      host: 127.0.0.1
      port: 4222
      http_port: 8222
      server_name: burstlab-local
      jetstream {
        store_dir: /data/jetstream
        # Make PubAck match this lab's literal power-loss durability boundary.
        sync_interval: ${NATS_SYNC_INTERVAL:-always}
      }
