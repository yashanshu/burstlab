[site]
title    = "BurstLab"
author   = "Vell"
language = "en"
baseurl  = "https://burstlab.aaiko.in"

[theme]
name = "concept-speedrun"

# Two independent audiences, spelled out rather than left to the defaults.
#   policy: "open" welcomes AI crawlers, "assist" declines training crawlers
#           but keeps user-directed assistants, "closed" declines both.
#   search: true is findable on Google and friends, false publishes a
#           noindex meta on every page.
# These are the values that were already in effect as defaults.
[modules.agents]
policy = "assist"
search = true
